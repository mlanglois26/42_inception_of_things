apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inception-of-things
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mlanglois26/42_inception_of_things_malanglo.git
    targetRevision: main
    path: p3/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
